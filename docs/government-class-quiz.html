  <script>
    window.GOVERNMENT_FLASHCARDS = [{"deck": "Class 1: SF Government Basics", "front": "What is the formal name of San Francisco?", "back": "The City and County of San Francisco."}, {"deck": "Class 1: SF Government Basics", "front": "What are the three levels of government discussed in class?", "back": "Federal, state, and local."}, {"deck": "Class 1: SF Government Basics", "front": "How long are elected officials' terms in San Francisco?", "back": "Four years."}, {"deck": "Class 1: SF Government Basics", "front": "Name the elected officials/entities listed for San Francisco.", "back": "Mayor, City Attorney, Public Defender, Sheriff, Board of Supervisors, Assessor-Recorder, City College Board of Trustees, Treasurer, District Attorney, and Board of Education."}, {"deck": "Class 1: SF Government Basics", "front": "What is the simple template for San Francisco's executive branch?", "back": "Elected officials appoint commissions, commissions oversee departments, and departments do the work."}, {"deck": "Class 1: SF Government Basics", "front": "Roughly how many commissions and departments does San Francisco have?", "back": "About 51-60 commissions and about 51-60 departments."}, {"deck": "Class 1: SF Government Basics", "front": "What is the approximate total San Francisco government budget for FY25-26?", "back": "About $16 billion."}, {"deck": "Class 1: SF Government Basics", "front": "What are the two broad categories of the city budget?", "back": "The General Fund and enterprise departments."}, {"deck": "Class 1: SF Government Basics", "front": "What are enterprise departments?", "back": "Self-supporting government agencies that generate their own revenue."}, {"deck": "Class 1: SF Government Basics", "front": "Which groups are social or political entities rather than official government bodies?", "back": "Democratic clubs and neighborhood associations."}, {"deck": "Class 1: SF Government Basics", "front": "Which groups are official advisory entities where citizens can provide input?", "back": "Citizens' Advisory Committees and the Civil Grand Jury."}, {"deck": "Class 1: SF Government Basics", "front": "What is the long-term roadmap for the city's physical development, and what law implements it?", "back": "The General Plan is the roadmap. The Planning Code is the local statutory law that implements it."}, {"deck": "Class 1: SF Government Basics", "front": "What are examples of mandates and state preemption in housing policy?", "back": "California requiring local governments to meet RHNA targets is a mandate. SB 423 overriding local planning is state preemption."}, {"deck": "Class 1: SF Government Basics", "front": "What are BART and ABAG?", "back": "BART is a regional public transit agency. ABAG is a council of governments that coordinates land use and housing policy across the region."}, {"deck": "Class 2: Law and Legislation", "front": "What does the Mayor do?", "back": "The Mayor is the chief executive and head of the executive branch."}, {"deck": "Class 2: Law and Legislation", "front": "What does the Board of Supervisors do?", "back": "The Board of Supervisors is the legislative body."}, {"deck": "Class 2: Law and Legislation", "front": "What does the Board of Education oversee?", "back": "The San Francisco Unified School District (SFUSD)."}, {"deck": "Class 2: Law and Legislation", "front": "What does the City College Board of Trustees oversee?", "back": "San Francisco's community college."}, {"deck": "Class 2: Law and Legislation", "front": "What does the Treasurer do?", "back": "Serves as banker, tax collector, and investment manager for San Francisco."}, {"deck": "Class 2: Law and Legislation", "front": "What does the Assessor-Recorder do?", "back": "Assesses taxable property and maintains records, including deeds."}, {"deck": "Class 2: Law and Legislation", "front": "What does the District Attorney do?", "back": "Prosecutes crimes on behalf of the people of San Francisco."}, {"deck": "Class 2: Law and Legislation", "front": "What does the Public Defender do?", "back": "Provides legal representation to people who cannot afford it."}, {"deck": "Class 2: Law and Legislation", "front": "What does the City Attorney do?", "back": "Acts as the city's legal department, drafts legislation, and represents the city in court."}, {"deck": "Class 2: Law and Legislation", "front": "What does the Sheriff do?", "back": "Manages county jails, oversees court and government-building security, and handles civil enforcement duties such as warrants and eviction orders."}, {"deck": "Class 2: Law and Legislation", "front": "What is constitutional law?", "back": "The highest law in a jurisdiction; it outlines the essential form and function of government."}, {"deck": "Class 2: Law and Legislation", "front": "What is statutory law?", "back": "Law created by a legislative body, often called statutes at the state and federal levels."}, {"deck": "Class 2: Law and Legislation", "front": "What is administrative law?", "back": "Rules or regulations issued by executive agencies that provide detailed implementation of existing statutory law."}, {"deck": "Class 2: Law and Legislation", "front": "What is case law?", "back": "Law created by judicial opinion that interprets the meaning and proper application of other types of law."}, {"deck": "Class 2: Law and Legislation", "front": "How many members are on the Board of Supervisors, and how many members are on standing legislative committees?", "back": "The Board of Supervisors has 11 members. Standing legislative committees have 3 members."}, {"deck": "Class 2: Law and Legislation", "front": "How is the President of the Board of Supervisors chosen?", "back": "By a vote of the Supervisors."}, {"deck": "Class 2: Law and Legislation", "front": "Who assigns membership of legislative committees?", "back": "The President of the Board."}, {"deck": "Class 2: Law and Legislation", "front": "What are the three main legislative actions the Board of Supervisors can take?", "back": "Ordinances, resolutions, and motions."}, {"deck": "Class 2: Law and Legislation", "front": "What is an ordinance?", "back": "A form of statutory law adopted through the legislative process."}, {"deck": "Class 2: Law and Legislation", "front": "What is a resolution?", "back": "A declaration of policy, subject to statutory law."}, {"deck": "Class 2: Law and Legislation", "front": "What is a motion?", "back": "A procedural act within the Board's exclusive jurisdiction, such as rules of order."}, {"deck": "Class 2: Law and Legislation", "front": "What may happen when a proposed ordinance is heard by a legislative committee?", "back": "The committee may hear expert testimony, receive public comment, vote to make a recommendation, and propose or adopt amendments."}, {"deck": "Class 2: Law and Legislation", "front": "Can a legislative committee itself pass an ordinance?", "back": "No. It can make recommendations and amendments, but passage occurs through the Board process."}, {"deck": "Class 3: Ballot Measures and Charter", "front": "What are the four types of law?", "back": "Constitutional law, statutory law, administrative law, and case law."}, {"deck": "Class 3: Ballot Measures and Charter", "front": "What is constitutional law?", "back": "Law that outlines the essential form and function of government and is the highest law in a jurisdiction."}, {"deck": "Class 3: Ballot Measures and Charter", "front": "What is statutory law?", "back": "Law created by legislative bodies."}, {"deck": "Class 3: Ballot Measures and Charter", "front": "What is administrative law?", "back": "Rules and regulations issued by executive agencies."}, {"deck": "Class 3: Ballot Measures and Charter", "front": "What is case law?", "back": "Law created by judicial opinion that interprets the meaning and application of other types of law."}, {"deck": "Class 3: Ballot Measures and Charter", "front": "What are the six major steps of San Francisco's legislative process?", "back": "Write legislation, introduce legislation, legislative committee hearing, legislative committee recommendation, full Board vote, and mayoral action."}, {"deck": "Class 3: Ballot Measures and Charter", "front": "Who may cause legislation to be written in the normal legislative process?", "back": "Commissions, Supervisors, the Mayor, and departments."}, {"deck": "Class 3: Ballot Measures and Charter", "front": "What are the two main ways to put something on the ballot?", "back": "Initiative and referral."}, {"deck": "Class 3: Ballot Measures and Charter", "front": "What is an initiative?", "back": "A ballot measure placed by the people after gathering a sufficient number of signatures."}, {"deck": "Class 3: Ballot Measures and Charter", "front": "What is a referral?", "back": "A ballot measure placed by the government, with procedures that vary depending on the type of measure."}, {"deck": "Class 3: Ballot Measures and Charter", "front": "What types of measures might appear on the ballot?", "back": "Ordinances, resolutions, legislative referenda, bond measures, recalls, charter adoption, charter repeal, charter amendments, and charter revisions."}, {"deck": "Class 3: Ballot Measures and Charter", "front": "What is the difference between enacted and effective legislation?", "back": "Enacted means legislation is formally passed and becomes law on the books. Effective means it becomes enforceable."}, {"deck": "Class 3: Ballot Measures and Charter", "front": "Which city officials may be recalled?", "back": "Board of Education members, Supervisors, the Controller, Treasurer, Mayor, District Attorney, City Administrator, Sheriff, and Ethics Commissioners."}, {"deck": "Class 3: Ballot Measures and Charter", "front": "Can a Supervisor send a Charter amendment to the ballot?", "back": "Yes, with Board majority approval."}, {"deck": "Class 3: Ballot Measures and Charter", "front": "Can the Mayor send an ordinance to the ballot?", "back": "Yes, acting independently."}, {"deck": "Class 3: Ballot Measures and Charter", "front": "How many voter signatures are needed to place a charter amendment on the ballot by petition?", "back": "At least 10% of registered voters in San Francisco, which was about 50,000 people as of November 2024."}, {"deck": "Class 3: Ballot Measures and Charter", "front": "Who has the authority to change the San Francisco Charter?", "back": "The people."}, {"deck": "Class 3: Ballot Measures and Charter", "front": "What are the key dates in the Class 3 political history timeline?", "back": "1849: California Constitution adopted. 1850: first State Legislature creates SF County and SF City. 1856: Consolidation Act. 1879: second California Constitution revision. 1898: first SF Charter adopted. 1932: second SF Charter revision. 1996: third SF Charter revision."}, {"deck": "Class 4: Planning and Housing", "front": "What are the General Plan, Housing Element, and Planning Code?", "back": "The General Plan is the long-term roadmap for physical development. The Housing Element describes actions to meet the RHNA target. The Planning Code is the local statutory law implementing the roadmap."}, {"deck": "Class 4: Planning and Housing", "front": "How long is each RHNA cycle?", "back": "Eight years."}, {"deck": "Class 4: Planning and Housing", "front": "What is San Francisco's current RHNA target and deadline?", "back": "San Francisco must approve 82,000 new housing units by 2031."}, {"deck": "Class 4: Planning and Housing", "front": "How is the Planning Commission appointed?", "back": "Four members are appointed by the Mayor with Board approval, and three are appointed by the Board."}, {"deck": "Class 4: Planning and Housing", "front": "Which government entity drafts the Housing Element?", "back": "The San Francisco Planning Department."}, {"deck": "Class 4: Planning and Housing", "front": "Which government entity sets the Regional Housing Needs Distribution (RHND)?", "back": "The California Department of Housing and Community Development (HCD)."}, {"deck": "Class 4: Planning and Housing", "front": "Which government entity enforces the Planning Code?", "back": "The San Francisco Planning Department."}, {"deck": "Class 4: Planning and Housing", "front": "Which government entity processes legislative referrals for General Plan and Planning Code consistency?", "back": "The San Francisco Planning Department."}, {"deck": "Class 4: Planning and Housing", "front": "What Planning Commission action can allow a project on a parcel not zoned for that use without changing statutory law?", "back": "A Conditional Use Authorization."}, {"deck": "Class 4: Planning and Housing", "front": "What is the difference between the RHNA target and SB 423?", "back": "The RHNA target is a state-imposed mandate. SB 423 is an example of state preemption overriding certain local land use controls."}, {"deck": "Class 4: Planning and Housing", "front": "If you get a speeding ticket in San Francisco, which court would you appear before?", "back": "San Francisco Superior Court."}, {"deck": "Class 4: Planning and Housing", "front": "What happened in 1849 in the political history timeline?", "back": "The California Constitution was adopted."}, {"deck": "Class 4: Planning and Housing", "front": "What happened in 1850 in the political history timeline?", "back": "The first State Legislature created San Francisco County and San Francisco City."}, {"deck": "Class 4: Planning and Housing", "front": "What happened in 1856 in the political history timeline?", "back": "The Consolidation Act."}, {"deck": "Class 4: Planning and Housing", "front": "What happened in 1879 in the political history timeline?", "back": "The second California Constitution was adopted as a revision."}, {"deck": "Class 4: Planning and Housing", "front": "What happened in 1898 in the political history timeline?", "back": "The San Francisco Charter was adopted."}, {"deck": "Class 4: Planning and Housing", "front": "When were the Planning Commission, Planning Code, and Planning Department created?", "back": "Planning Commission: 1917. Planning Code: 1921. Planning Department: 1942."}, {"deck": "Class 4: Planning and Housing", "front": "When was the first General Plan adopted?", "back": "1945."}, {"deck": "Class 4: Planning and Housing", "front": "What happened in 1960 and 1996 in the political history timeline?", "back": "1960: second San Francisco Planning Code. 1996: third San Francisco Charter revision."}, {"deck": "Class 1: SF Government Basics", "front": "Which San Francisco government roles are not elected offices?", "back": "Clerk of the Board, Superior Court Judge, Controller, City Administrator, Chief of Police, and County Clerk are not elected offices in this civic structure."}, {"deck": "Class 1: SF Government Basics", "front": "Is the Clerk of the Board an elected official in San Francisco?", "back": "No."}, {"deck": "Class 1: SF Government Basics", "front": "Is the Controller an elected official in San Francisco?", "back": "No."}, {"deck": "Class 1: SF Government Basics", "front": "Is the City Administrator an elected official in San Francisco?", "back": "No."}, {"deck": "Class 1: SF Government Basics", "front": "Is the Chief of Police an elected official in San Francisco?", "back": "No."}, {"deck": "Class 1: SF Government Basics", "front": "In the executive branch template, what are commissions described as?", "back": "Commissions are the approvers."}, {"deck": "Class 1: SF Government Basics", "front": "In the executive branch template, what are departments described as?", "back": "Departments are the doers."}, {"deck": "Class 1: SF Government Basics", "front": "In the executive branch template, who appoints commissions?", "back": "Elected officials appoint commissions."}, {"deck": "Class 1: SF Government Basics", "front": "In the executive branch template, who oversees departments?", "back": "Commissions oversee departments."}, {"deck": "Class 1: SF Government Basics", "front": "What is the General Fund?", "back": "The primary city budget category, funded mainly through taxes."}, {"deck": "Class 1: SF Government Basics", "front": "Is the General Plan one of the two broad city budget categories?", "back": "No. The two broad budget categories are the General Fund and enterprise departments."}, {"deck": "Class 1: SF Government Basics", "front": "Are the Civil Grand Jury and Citizens' Advisory Committees social/political entities or advisory entities?", "back": "They are advisory entities."}, {"deck": "Class 1: SF Government Basics", "front": "Are Democratic clubs and neighborhood associations official advisory entities?", "back": "No. They are social/political entities, not official advisory entities."}, {"deck": "Class 1: SF Government Basics", "front": "What does RHNA stand for in the housing context of these quizzes?", "back": "Regional Housing Needs Allocation."}, {"deck": "Class 2: Law and Legislation", "front": "Which elected official is San Francisco's chief executive?", "back": "The Mayor."}, {"deck": "Class 2: Law and Legislation", "front": "Which elected body is San Francisco's legislative body?", "back": "The Board of Supervisors."}, {"deck": "Class 2: Law and Legislation", "front": "Which elected entity oversees SFUSD?", "back": "The Board of Education."}, {"deck": "Class 2: Law and Legislation", "front": "Which elected entity oversees San Francisco's community college?", "back": "The City College Board of Trustees."}, {"deck": "Class 2: Law and Legislation", "front": "Which official serves as banker, tax collector, and investment manager for San Francisco?", "back": "The Treasurer."}, {"deck": "Class 2: Law and Legislation", "front": "Which official assesses taxable property and maintains property records including deeds?", "back": "The Assessor-Recorder."}, {"deck": "Class 2: Law and Legislation", "front": "Which official prosecutes crimes on behalf of the people of San Francisco?", "back": "The District Attorney."}, {"deck": "Class 2: Law and Legislation", "front": "Which official provides legal representation to people who cannot afford it?", "back": "The Public Defender."}, {"deck": "Class 2: Law and Legislation", "front": "Which office drafts legislation and represents the city in court?", "back": "The City Attorney."}, {"deck": "Class 2: Law and Legislation", "front": "Which official manages county jails and handles civil enforcement duties like warrants and eviction orders?", "back": "The Sheriff."}, {"deck": "Class 2: Law and Legislation", "front": "Is constitutional law issued by executive agencies?", "back": "No. Administrative law is issued by executive agencies."}, {"deck": "Class 2: Law and Legislation", "front": "Is statutory law created by judicial opinion?", "back": "No. Case law is created by judicial opinion. Statutory law is created by legislative bodies."}, {"deck": "Class 2: Law and Legislation", "front": "Is administrative law often called a rule or regulation?", "back": "Yes. Administrative law is often called a rule or regulation."}, {"deck": "Class 2: Law and Legislation", "front": "Which type of law is detailed implementation of existing statutory law?", "back": "Administrative law."}, {"deck": "Class 2: Law and Legislation", "front": "Which type of law interprets the meaning and proper application of other types of law?", "back": "Case law."}, {"deck": "Class 2: Law and Legislation", "front": "Which type of law is often called statute at the state and federal levels?", "back": "Statutory law."}, {"deck": "Class 2: Law and Legislation", "front": "What type of law are commission regulations?", "back": "Administrative law."}, {"deck": "Class 2: Law and Legislation", "front": "What type of law is the San Francisco Charter?", "back": "Statutory law."}, {"deck": "Class 2: Law and Legislation", "front": "What type of law is the Administrative Code?", "back": "Statutory law."}, {"deck": "Class 2: Law and Legislation", "front": "What type of law are Municipal Codes?", "back": "Statutory law."}, {"deck": "Class 2: Law and Legislation", "front": "What type of law are Mayoral Executive Directives?", "back": "Administrative law."}, {"deck": "Class 2: Law and Legislation", "front": "What type of law is the Police Code?", "back": "Statutory law."}, {"deck": "Class 2: Law and Legislation", "front": "What type of law are department regulations?", "back": "Administrative law."}, {"deck": "Class 2: Law and Legislation", "front": "Can a proposed ordinance heard by legislative committee receive public comment?", "back": "Yes."}, {"deck": "Class 2: Law and Legislation", "front": "Can a proposed ordinance heard by legislative committee receive expert testimony?", "back": "Yes."}, {"deck": "Class 2: Law and Legislation", "front": "Can a proposed ordinance heard by legislative committee be amended?", "back": "Yes. The committee can propose and adopt amendments."}, {"deck": "Class 2: Law and Legislation", "front": "Can a proposed ordinance heard by legislative committee get a recommendation vote?", "back": "Yes. The committee can vote to make a recommendation."}, {"deck": "Class 3: Ballot Measures and Charter", "front": "What name completes the four-type law framework: constitutional, statutory, administrative, and ____?", "back": "Case law."}, {"deck": "Class 3: Ballot Measures and Charter", "front": "What is Step 1 of San Francisco's legislative process?", "back": "Write legislation."}, {"deck": "Class 3: Ballot Measures and Charter", "front": "What is Step 2 of San Francisco's legislative process?", "back": "Introduce legislation."}, {"deck": "Class 3: Ballot Measures and Charter", "front": "What is Step 3 of San Francisco's legislative process?", "back": "Legislative committee hearing."}, {"deck": "Class 3: Ballot Measures and Charter", "front": "What is Step 4 of San Francisco's legislative process?", "back": "Legislative committee recommendation."}, {"deck": "Class 3: Ballot Measures and Charter", "front": "What is Step 5 of San Francisco's legislative process?", "back": "Full Board vote."}, {"deck": "Class 3: Ballot Measures and Charter", "front": "What is Step 6 of San Francisco's legislative process?", "back": "Mayoral action."}, {"deck": "Class 3: Ballot Measures and Charter", "front": "Can citizens directly cause legislation to be written in San Francisco's normal legislative process?", "back": "No. The selected answers were commissions, Supervisors, the Mayor, and departments."}, {"deck": "Class 3: Ballot Measures and Charter", "front": "Can Citizens' Advisory Committees directly cause legislation to be written in San Francisco's normal legislative process?", "back": "No. Legislation can be caused by commissions, Supervisors, the Mayor, and departments."}, {"deck": "Class 3: Ballot Measures and Charter", "front": "Are motions ballot measures?", "back": "No. Motions are procedural acts, not ballot-measure types."}, {"deck": "Class 3: Ballot Measures and Charter", "front": "Are court opinions ballot measures?", "back": "No. Court opinions are case law, not ballot measures."}, {"deck": "Class 3: Ballot Measures and Charter", "front": "Are mayoral executive directives ballot measures?", "back": "No. Mayoral executive directives are administrative actions, not ballot measures."}, {"deck": "Class 3: Ballot Measures and Charter", "front": "Are commissioner appointments ballot measures?", "back": "No. Commissioner appointments are appointment actions, not ballot measures."}, {"deck": "Class 3: Ballot Measures and Charter", "front": "Which San Francisco roles are not recallable officials?", "back": "Chief of Police, Director of Planning, Police Commissioner, and County Clerk are not recallable officials in this framework."}, {"deck": "Class 3: Ballot Measures and Charter", "front": "Can the people change the San Francisco Charter?", "back": "Yes. The people have authority to change the Charter."}, {"deck": "Class 3: Ballot Measures and Charter", "front": "Can the Board of Supervisors, Mayor, Rules Committee, or City Attorney independently change the San Francisco Charter?", "back": "No. Charter changes ultimately require the people."}, {"deck": "Class 4: Planning and Housing", "front": "What does the Housing Element do?", "back": "It describes actions the city will take to meet its RHNA target."}, {"deck": "Class 4: Planning and Housing", "front": "What is the Planning Code?", "back": "The local statutory law that implements the General Plan roadmap."}, {"deck": "Class 4: Planning and Housing", "front": "What does the SF Planning Department do in the Housing Element process?", "back": "The SF Planning Department drafts the Housing Element."}, {"deck": "Class 4: Planning and Housing", "front": "What does HCD do in the Regional Housing Needs Distribution process?", "back": "The California Department of Housing and Community Development sets the RHND."}, {"deck": "Class 4: Planning and Housing", "front": "What does the SF Planning Department do with the Planning Code?", "back": "The SF Planning Department enforces the Planning Code."}, {"deck": "Class 4: Planning and Housing", "front": "Which entity processes legislative referrals for consistency with the General Plan and Planning Code priority policies?", "back": "The SF Planning Department."}, {"deck": "Class 4: Planning and Housing", "front": "Which Planning Commission action can allow a project on a parcel not zoned for that use without changing statutory law?", "back": "Conditional Use Authorization."}, {"deck": "Class 4: Planning and Housing", "front": "What does a zoning variance generally address?", "back": "A zoning variance addresses relief from specific zoning requirements, but the quiz concept to remember is that Conditional Use Authorization allows certain uses without changing statutory law."}, {"deck": "Class 4: Planning and Housing", "front": "What does a Planning Code Amendment do?", "back": "A Planning Code Amendment changes the statutory law."}, {"deck": "Class 4: Planning and Housing", "front": "Which court handles a local San Francisco speeding ticket?", "back": "San Francisco Superior Court."}, {"deck": "Class 4: Planning and Housing", "front": "What is the Class 4 timeline order from 1849 through 1996?", "back": "1849 CA Constitution; 1850 first State Legislature creates SF County and SF City; 1856 Consolidation Act; 1879 second CA Constitution; 1898 SF Charter; 1917 Planning Commission; 1921 Planning Code; 1932 second SF Charter; 1942 Planning Department; 1945 first General Plan; 1960 second Planning Code; 1996 third SF Charter."}];
