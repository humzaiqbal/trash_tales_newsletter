  <script>
    window.GOVERNMENT_FLASHCARDS = [{"deck": "Class 1: SF Government Basics", "front": "What is the formal name of San Francisco?", "back": "The City and County of San Francisco."}, {"deck": "Class 1: SF Government Basics", "front": "What are the three levels of government discussed in class?", "back": "Federal, state, and local."}, {"deck": "Class 1: SF Government Basics", "front": "How long are elected officials' terms in San Francisco?", "back": "Four years."}, {"deck": "Class 1: SF Government Basics", "front": "Name the elected officials/entities listed for San Francisco.", "back": "Mayor, City Attorney, Public Defender, Sheriff, Board of Supervisors, Assessor-Recorder, City College Board of Trustees, Treasurer, District Attorney, and Board of Education."}, {"deck": "Class 1: SF Government Basics", "front": "What is the simple template for San Francisco's executive branch?", "back": "Elected officials appoint commissions, commissions oversee departments, and departments do the work."}, {"deck": "Class 1: SF Government Basics", "front": "Roughly how many commissions and departments does San Francisco have?", "back": "About 51-60 commissions and about 51-60 departments."}, {"deck": "Class 1: SF Government Basics", "front": "What is the approximate total San Francisco government budget for FY25-26?", "back": "About $16 billion."}, {"deck": "Class 1: SF Government Basics", "front": "What are the two broad categories of the city budget?", "back": "The General Fund and enterprise departments."}, {"deck": "Class 1: SF Government Basics", "front": "What are enterprise departments?", "back": "Self-supporting government agencies that generate their own revenue."}, {"deck": "Class 1: SF Government Basics", "front": "Which groups are social or political entities rather than official government bodies?", "back": "Democratic clubs and neighborhood associations."}, {"deck": "Class 1: SF Government Basics", "front": "Which groups are official advisory entities where citizens can provide input?", "back": "Citizens' Advisory Committees and the Civil Grand Jury."}, {"deck": "Class 1: SF Government Basics", "front": "What is the long-term roadmap for the city's physical development, and what law implements it?", "back": "The General Plan is the roadmap. The Planning Code is the local statutory law that implements it."}, {"deck": "Class 1: SF Government Basics", "front": "What are examples of mandates and state preemption in housing policy?", "back": "California requiring local governments to meet RHNA targets is a mandate. SB 423 overriding local planning is state preemption."}, {"deck": "Class 1: SF Government Basics", "front": "What are BART and ABAG?", "back": "BART is a regional public transit agency. ABAG is a council of governments that coordinates land use and housing policy across the region."}, {"deck": "Class 2: Law and Legislation", "front": "What does the Mayor do?", "back": "The Mayor is the chief executive and head of the executive branch."}, {"deck": "Class 2: Law and Legislation", "front": "What does the Board of Supervisors do?", "back": "The Board of Supervisors is the legislative body."}, {"deck": "Class 2: Law and Legislation", "front": "What does the Board of Education oversee?", "back": "The San Francisco Unified School District (SFUSD)."}, {"deck": "Class 2: Law and Legislation", "front": "What does the City College Board of Trustees oversee?", "back": "San Francisco's community college."}, {"deck": "Class 2: Law and Legislation", "front": "What does the Treasurer do?", "back": "Serves as banker, tax collector, and investment manager for San Francisco."}, {"deck": "Class 2: Law and Legislation", "front": "What does the Assessor-Recorder do?", "back": "Assesses taxable property and maintains records, including deeds."}, {"deck": "Class 2: Law and Legislation", "front": "What does the District Attorney do?", "back": "Prosecutes crimes on behalf of the people of San Francisco."}, {"deck": "Class 2: Law and Legislation", "front": "What does the Public Defender do?", "back": "Provides legal representation to people who cannot afford it."}, {"deck": "Class 2: Law and Legislation", "front": "What does the City Attorney do?", "back": "Acts as the city's legal department, drafts legislation, and represents the city in court."}, {"deck": "Class 2: Law and Legislation", "front": "What does the Sheriff do?", "back": "Manages county jails, oversees court and government-building security, and handles civil enforcement duties such as warrants and eviction orders."}, {"deck": "Class 2: Law and Legislation", "front": "What is constitutional law?", "back": "The highest law in a jurisdiction; it outlines the essential form and function of government."}, {"deck": "Class 2: Law and Legislation", "front": "What is statutory law?", "back": "Law created by a legislative body, often called statutes at the state and federal levels."}, {"deck": "Class 2: Law and Legislation", "front": "What is administrative law?", "back": "Rules or regulations issued by executive agencies that provide detailed implementation of existing statutory law."}, {"deck": "Class 2: Law and Legislation", "front": "What is case law?", "back": "Law created by judicial opinion that interprets the meaning and proper application of other types of law."}, {"deck": "Class 2: Law and Legislation", "front": "How many members are on the Board of Supervisors, and how many members are on standing legislative committees?", "back": "The Board of Supervisors has 11 members. Standing legislative committees have 3 members."}, {"deck": "Class 2: Law and Legislation", "front": "How is the President of the Board of Supervisors chosen?", "back": "By a vote of the Supervisors."}, {"deck": "Class 2: Law and Legislation", "front": "Who assigns membership of legislative committees?", "back": "The President of the Board."}, {"deck": "Class 2: Law and Legislation", "front": "What are the three main legislative actions the Board of Supervisors can take?", "back": "Ordinances, resolutions, and motions."}, {"deck": "Class 2: Law and Legislation", "front": "What is an ordinance?", "back": "A form of statutory law adopted through the legislative process."}, {"deck": "Class 2: Law and Legislation", "front": "What is a resolution?", "back": "A declaration of policy, subject to statutory law."}, {"deck": "Class 2: Law and Legislation", "front": "What is a motion?", "back": "A procedural act within the Board's exclusive jurisdiction, such as rules of order."}, {"deck": "Class 2: Law and Legislation", "front": "What may happen when a proposed ordinance is heard by a legislative committee?", "back": "The committee may hear expert testimony, receive public comment, vote to make a recommendation, and propose or adopt amendments."}, {"deck": "Class 2: Law and Legislation", "front": "Can a legislative committee itself pass an ordinance?", "back": "No. It can make recommendations and amendments, but passage occurs through the Board process."}, {"deck": "Class 4: Planning and Housing", "front": "What are the General Plan, Housing Element, and Planning Code?", "back": "The General Plan is the long-term roadmap for physical development. The Housing Element describes actions to meet the RHNA target. The Planning Code is the local statutory law implementing the roadmap."}, {"deck": "Class 4: Planning and Housing", "front": "How long is each RHNA cycle?", "back": "Eight years."}, {"deck": "Class 4: Planning and Housing", "front": "What is San Francisco's current RHNA target and deadline?", "back": "San Francisco must approve 82,000 new housing units by 2031."}, {"deck": "Class 4: Planning and Housing", "front": "How is the Planning Commission appointed?", "back": "Four members are appointed by the Mayor with Board approval, and three are appointed by the Board."}, {"deck": "Class 4: Planning and Housing", "front": "Which government entity drafts the Housing Element?", "back": "The San Francisco Planning Department."}, {"deck": "Class 4: Planning and Housing", "front": "Which government entity sets the Regional Housing Needs Distribution (RHND)?", "back": "The California Department of Housing and Community Development (HCD)."}, {"deck": "Class 4: Planning and Housing", "front": "Which government entity enforces the Planning Code?", "back": "The San Francisco Planning Department."}, {"deck": "Class 4: Planning and Housing", "front": "Which government entity processes legislative referrals for General Plan and Planning Code consistency?", "back": "The San Francisco Planning Department."}, {"deck": "Class 4: Planning and Housing", "front": "What Planning Commission action can allow a project on a parcel not zoned for that use without changing statutory law?", "back": "A Conditional Use Authorization."}, {"deck": "Class 4: Planning and Housing", "front": "What is the difference between the RHNA target and SB 423?", "back": "The RHNA target is a state-imposed mandate. SB 423 is an example of state preemption overriding certain local land use controls."}, {"deck": "Class 4: Planning and Housing", "front": "If you get a speeding ticket in San Francisco, which court would you appear before?", "back": "San Francisco Superior Court."}, {"deck": "Class 4: Planning and Housing", "front": "What happened in 1849 in the political history timeline?", "back": "The California Constitution was adopted."}, {"deck": "Class 4: Planning and Housing", "front": "What happened in 1850 in the political history timeline?", "back": "The first State Legislature created San Francisco County and San Francisco City."}, {"deck": "Class 4: Planning and Housing", "front": "What happened in 1856 in the political history timeline?", "back": "The Consolidation Act."}, {"deck": "Class 4: Planning and Housing", "front": "What happened in 1879 in the political history timeline?", "back": "The second California Constitution was adopted as a revision."}, {"deck": "Class 4: Planning and Housing", "front": "What happened in 1898 in the political history timeline?", "back": "The San Francisco Charter was adopted."}, {"deck": "Class 4: Planning and Housing", "front": "When were the Planning Commission, Planning Code, and Planning Department created?", "back": "Planning Commission: 1917. Planning Code: 1921. Planning Department: 1942."}, {"deck": "Class 4: Planning and Housing", "front": "When was the first General Plan adopted?", "back": "1945."}, {"deck": "Class 4: Planning and Housing", "front": "What happened in 1960 and 1996 in the political history timeline?", "back": "1960: second San Francisco Planning Code. 1996: third San Francisco Charter revision."}];
  </script>
