<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
  <title>Pushup weight and reps over time</title>
  <desc>Dot plot from Aug 4 to Aug 25. Vertical position is weight and dot size represents reps or time.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="82" y="24" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328">Pushup</text>
  <text x="82" y="44" font-family="Inter, Arial, sans-serif" font-size="12" fill="#59636e">Weight by date · dot size = reps/time</text>
  <line x1="82" y1="314" x2="732" y2="314" stroke="#d7dde4"/>
  <line x1="82" y1="58" x2="82" y2="314" stroke="#d7dde4"/>
  <line x1="82" y1="186.0" x2="732" y2="186.0" stroke="#eef1f5"/>
  <text x="70" y="318.0" text-anchor="end">BW</text><text x="70" y="190.0" text-anchor="end">0.55</text><text x="70" y="62.0" text-anchor="end">1.1</text>
  <g fill="#0b57d0" fill-opacity="0.62" stroke="#0847a8" stroke-width="1"><circle cx="82.0" cy="314.0" r="10.8"><title>Aug 4 · Set 1: BW weight, 5.0 reps/time</title></circle><circle cx="82.0" cy="314.0" r="10.8"><title>Aug 4 · Set 2: BW weight, 5.0 reps/time</title></circle><circle cx="89.0" cy="314.0" r="11.4"><title>Aug 4 · Set 3: BW weight, 6.0 reps/time</title></circle><circle cx="291.7" cy="314.0" r="11.4"><title>Aug 11 · Set 1: BW weight, 6.0 reps/time</title></circle><circle cx="298.7" cy="314.0" r="11.4"><title>Aug 11 · Set 2: BW weight, 6.0 reps/time</title></circle><circle cx="305.7" cy="314.0" r="10.8"><title>Aug 11 · Set 3: BW weight, 5.0 reps/time</title></circle><circle cx="504.8" cy="314.0" r="11.4"><title>Aug 18 · Set 1: BW weight, 6.0 reps/time</title></circle><circle cx="511.8" cy="314.0" r="12.0"><title>Aug 18 · Set 2: BW weight, 7,1 reps/time</title></circle><circle cx="518.8" cy="314.0" r="11.4"><title>Aug 18 · Set 3: BW weight, 6.0 reps/time</title></circle><circle cx="525.8" cy="314.0" r="10.2"><title>Aug 18 · Set 4: BW weight, 4.0 reps/time</title></circle><circle cx="721.5" cy="314.0" r="12.5"><title>Aug 25 · Set 1: BW weight, 8.0 reps/time</title></circle><circle cx="728.5" cy="314.0" r="11.4"><title>Aug 25 · Set 2: BW weight, 6.0 reps/time</title></circle><circle cx="732.0" cy="314.0" r="10.2"><title>Aug 25 · Set 3: BW weight, 4.0 reps/time</title></circle><circle cx="732.0" cy="314.0" r="10.2"><title>Aug 25 · Set 4: BW weight, 4.0 reps/time</title></circle></g>
  <text x="30" y="186.0" font-family="Inter, Arial, sans-serif" font-size="12" fill="#59636e" text-anchor="middle" transform="rotate(-90 30 186.0)">Weight</text>
  <text x="82" y="350" font-family="Inter, Arial, sans-serif" font-size="12" fill="#59636e" text-anchor="start">Aug 4</text>
  <text x="732" y="350" font-family="Inter, Arial, sans-serif" font-size="12" fill="#59636e" text-anchor="end">Aug 25</text>
  <text x="407.0" y="370" font-family="Inter, Arial, sans-serif" font-size="12" fill="#59636e" text-anchor="middle">Time</text>
</svg>
